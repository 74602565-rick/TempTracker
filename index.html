<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Tracker</title>

    <link rel="stylesheet" href="./estilos.css">
</head>
<body>
    <script src="./codigo.js"></script>
    <div class="contenedor">
        <div class="buscador">
            <input 
            type="text"
            placeholder="Ingresa nombre de la ciudad"
            spellcheck="false"
            autocomplete="false"
            id="input-ciudad"/>

            <button onclick="obtenerClima()">
                <img src="imagenes/lupa1-icon.png">
            </button>
        </div>

        <div class="clima-info">
            <p class="clima-texto">Parcialmente nublado</p>
            <img src="imagenes/clima-removebg-preview.png" class="clima-icono"/>
            <h1 class="Temp">22°c</h1>
            <h2 class="ciudad">Huancayo</h2>
            <div class="detalles">
                <div class="col">
                    <img src="imagenes/humedad-removebg-preview.png"/>
                    <div>
                        <p class="humedad">50%</p>
                        <p>Humedad</p>
                    </div>
                </div>

                <div class="col">
                    <img src="imagenes/viento-removebg-preview.png"/>
                    <div>
                        <p class="viento">15 Km/h</p>
                        <p>Viento</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
